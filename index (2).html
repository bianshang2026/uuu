<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Copilot">
<meta name="theme-color" content="#0f1115">
<title>Interview Copilot</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--fg:#e8eaf0;--mut:#8a90a0;--acc:#4f8cff;--ok:#2fbf71;--bad:#ff5a5f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;gap:8px;align-items:center;padding:10px 12px}
header h1{font-size:17px;margin:0;flex:1}
button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;color:#fff;background:var(--acc)}
button.sec{background:#2a2e38}
button.rec{background:var(--ok)}
button.rec.on{background:var(--bad)}
main{flex:1;overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:14px;padding:12px}
.lbl{font-size:12px;color:var(--mut);margin-bottom:4px;display:flex;justify-content:space-between}
#tr{max-height:32vh;overflow-y:auto;white-space:pre-wrap}
#interim{color:var(--mut)}
#ans{white-space:pre-wrap;min-height:90px;font-size:17px}
.bar{display:flex;gap:8px;padding:10px 12px}
.bar button{flex:1}
dialog{background:var(--card);color:var(--fg);border:0;border-radius:16px;width:92%;max-width:520px;max-height:88vh;overflow-y:auto}
dialog::backdrop{background:#000a}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0f1115;color:var(--fg);border:1px solid #2d323d;border-radius:10px;padding:10px;font-size:16px}
textarea{min-height:80px}
.row{display:flex;gap:8px;align-items:center}
.row input[type=checkbox]{width:auto}
</style>
</head>
<body>
<header>
  <h1>🎙️ Interview Copilot</h1>
  <button class="sec" id="btnSet">设置</button>
</header>

<main>
  <div class="card">
    <div class="lbl"><span>面试官（实时转录）</span><span id="status">未开始</span></div>
    <div id="tr"></div><div id="interim"></div>
  </div>
  <div class="card">
    <div class="lbl"><span>AI 建议回答</span><span id="mdl"></span></div>
    <div id="ans">点“开始”，把手机靠近电脑扬声器。面试官问完后会自动出答案。</div>
  </div>
</main>

<div class="bar">
  <button class="rec" id="btnRec">开始</button>
  <button class="sec" id="btnClr">清空</button>
</div>

<dialog id="dlg">
  <h3 style="margin:0">设置</h3>
  <label>API 地址（OpenAI 兼容）</label>
  <input id="base" placeholder="https://api.openai.com/v1">
  <label>API Key</label>
  <input id="key" type="password" placeholder="sk-...">
  <label>对话模型</label>
  <input id="model" placeholder="gpt-4o-mini / deepseek-chat ...">
  <label>转录方式</label>
  <select id="engine">
    <option value="web">Safari 自带识别（免费，需在 Safari 里用）</option>
    <option value="whisper">Whisper API（更准，可在主屏幕 App 里用）</option>
  </select>
  <label>转录模型（Whisper 模式）</label>
  <input id="wmodel" placeholder="whisper-1">
  <label>面试官语言</label>
  <select id="lang"><option value="en-US">English</option><option value="zh-CN">中文</option></select>
  <label>我的背景 / 简历要点（会发给大模型）</label>
  <textarea id="bg" placeholder="例如：3年后端经验，Java/Go，做过支付系统…"></textarea>
  <label>回答风格提示词</label>
  <textarea id="sys"></textarea>
  <div class="row" style="margin-top:16px"><button id="btnSave" style="flex:1">保存</button><button class="sec" id="btnLink">复制专属链接</button></div>
  <p style="font-size:12px;color:var(--mut)">保存后，请用【当前网址】添加到主屏幕或收藏。设置会随网址一起保存，不会再丢。该链接含你的 Key，请勿分享给别人。</p>
</dialog>

<script>
const $ = id => document.getElementById(id);
const DEF = {
  base:'https://api.openai.com/v1', key:'', model:'gpt-4o-mini', engine:'web', wmodel:'whisper-1',
  lang:'en-US', bg:'',
  sys:'你是面试辅助。根据面试官刚说的话，给出可以直接念出来的回答：口语化、第一人称、结构清晰（先结论后要点）、控制在 120 词以内。用与面试官相同的语言回答。如果问题不完整，先给出最可能的理解。'
};
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = x => JSON.parse(decodeURIComponent(escape(atob(x))));
let cfg = Object.assign({}, DEF);
try { Object.assign(cfg, JSON.parse(localStorage.getItem('ic_cfg') || '{}')); } catch(e){}
// 备份：设置同时存在网址 # 后面，localStorage 被 iOS 清掉也能恢复
try { const m = location.hash.match(/#c=([^&]+)/); if (m) Object.assign(cfg, dec(decodeURIComponent(m[1]))); } catch(e){}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

let running = false, finalText = '', pending = '', t1 = null, t2 = null, wake = null, ctrl = null;
const history = [];

function save(){
  try{ localStorage.setItem('ic_cfg', JSON.stringify(cfg)); }catch(e){}
  try{ history.replaceState(null,'','#c='+encodeURIComponent(enc(cfg))); }catch(e){}
}
save();
function loadForm(){ for (const k in DEF){ const el=$(k); if(!el) continue; if(el.type==='checkbox') el.checked=cfg[k]; else el.value=cfg[k]; } }
$('btnSet').onclick = () => { loadForm(); $('dlg').showModal(); };
$('btnSave').onclick = () => { for (const k in DEF){ const el=$(k); if(!el) continue; cfg[k]= el.type==='checkbox'? el.checked : el.value.trim(); } save(); $('mdl').textContent=cfg.model; $('dlg').close(); };
$('btnLink').onclick = async () => { try{ await navigator.clipboard.writeText(location.href); $('btnLink').textContent='已复制'; }catch(e){ prompt('长按复制：', location.href); } };
$('mdl').textContent = cfg.model;
if (!cfg.key) setTimeout(()=>$('btnSet').click(), 300);

function setStatus(s){ $('status').textContent = s; }
function addFinal(t){
  t = t.trim(); if(!t) return;
  finalText += t + '\n'; pending += (pending?' ':'') + t;
  $('tr').textContent = finalText; $('tr').scrollTop = 1e9;
  schedule();
}
function schedule(){
  clearTimeout(t1); clearTimeout(t2);
  t1 = setTimeout(()=>ask(false), 1100);   // 短停顿：让大模型判断问题是否说完
  t2 = setTimeout(()=>ask(true), 4500);    // 长停顿：强制视为说完
}

/* ---------- Engine A: Safari Web Speech ---------- */
let sr = null;
function startWeb(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ alert('此浏览器不支持语音识别，请在 Safari 中打开或改用 Whisper 模式。'); return false; }
  sr = new SR(); sr.continuous = true; sr.interimResults = true; sr.lang = cfg.lang;
  sr.onresult = e => {
    let interim = '';
    for (let i=e.resultIndex; i<e.results.length; i++){
      const r = e.results[i];
      if (r.isFinal) addFinal(r[0].transcript); else interim += r[0].transcript;
    }
    $('interim').textContent = interim;
    if (interim){ clearTimeout(t1); clearTimeout(t2); }
  };
  sr.onerror = e => {
    const M = {
      'not-allowed':'麦克风/识别权限被拒绝。请到 iPhone「设置 → Safari → 麦克风」改为允许，或在 Safari 地址栏左侧 aA → 网站设置 → 麦克风 → 允许，然后刷新页面。',
      'service-not-allowed':'iOS 的听写/Siri 没开，或当前是“主屏幕 App”模式（iOS 常常不允许）。请：①设置 → 通用 → 键盘 → 开启「启用听写」；②设置 → Siri → 开启；③直接在 Safari 里打开本页，不要从主屏幕图标进；④或在设置里改用 Whisper 模式。',
      'audio-capture':'找不到可用的麦克风。',
      'network':'Safari 语音识别需要联网，请检查网络。'
    };
    if (M[e.error]){ stop(); setStatus('已停止：'+e.error); $('interim').textContent = M[e.error]; }
    else setStatus('● 聆听中（'+e.error+'）');
  };
  sr.onend = () => { if (running) { try{ sr.start(); }catch(e){} } };
  try{ sr.start(); }catch(e){}
  return true;
}

/* ---------- Engine B: MediaRecorder + Whisper ---------- */
let stream = null, segTimer = null;
async function startWhisper(){
  if (!cfg.key){ alert('请先填写 API Key'); return false; }
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ alert('无法获取麦克风：'+e.message); return false; }
  const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
  const ext = mime==='audio/mp4' ? 'm4a' : 'webm';
  const segment = () => {
    if (!running) return;
    const rec = new MediaRecorder(stream, {mimeType: mime}); const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => { const blob = new Blob(chunks,{type:mime}); if (blob.size>4000) transcribe(blob, ext); };
    rec.start(); segTimer = setTimeout(()=>{ rec.state!=='inactive' && rec.stop(); segment(); }, 6000);
  };
  segment(); return true;
}
async function transcribe(blob, ext){
  const fd = new FormData();
  fd.append('file', blob, 'a.'+ext); fd.append('model', cfg.wmodel||'whisper-1');
  fd.append('language', cfg.lang.slice(0,2));
  try{
    const r = await fetch(cfg.base.replace(/\/$/,'')+'/audio/transcriptions', {method:'POST', headers:{Authorization:'Bearer '+cfg.key}, body:fd});
    const j = await r.json();
    if (j.text) addFinal(j.text); else if (j.error) setStatus('转录错误');
  }catch(e){ setStatus('网络错误'); }
}

/* ---------- LLM (streaming, OpenAI-compatible) ---------- */
async function ask(force){
  const q = pending.trim(); if(!q || !running) return;
  if (!cfg.key){ $('btnSet').click(); return; }
  if (ctrl) ctrl.abort(); ctrl = new AbortController();
  const proto = '\n\n【输出协议】我会把面试官到目前为止说的话发给你，他可能还没说完。\n'
    + '- 如果问题明显没说完（句子被截断、还在铺垫、只说了一半），只输出 [WAIT]\n'
    + '- 如果是寒暄、过渡语或不需要我回答的内容，只输出 [SKIP]\n'
    + '- 如果问题已经完整，直接输出回答，不要任何前缀。'
    + (force ? '\n- 注意：面试官已经停顿很久，除非纯寒暄，否则必须回答。' : '');
  const sys = cfg.sys + (cfg.bg ? '\n\n【我的背景】\n'+cfg.bg : '') + proto;
  const msgs = [{role:'system',content:sys}, ...history.slice(-8), {role:'user',content:'面试官说：'+q}];
  let out = '', shown = false, decision = '';
  setStatus('● 判断中');
  try{
    const r = await fetch(cfg.base.replace(/\/$/,'')+'/chat/completions', {
      method:'POST', signal:ctrl.signal,
      headers:{'Content-Type':'application/json', Authorization:'Bearer '+cfg.key},
      body: JSON.stringify({model:cfg.model, messages:msgs, stream:true})
    });
    if (!r.ok){ $('ans').textContent = '错误 '+r.status+'：'+(await r.text()).slice(0,300); setStatus('● 聆听中'); return; }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf='';
    outer: while(true){
      const {done,value} = await rd.read(); if(done) break;
      buf += dec.decode(value,{stream:true}); const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines){
        if (!l.startsWith('data:')) continue; const d = l.slice(5).trim(); if (d==='[DONE]') continue;
        let t; try{ t = JSON.parse(d).choices?.[0]?.delta?.content; }catch(e){}
        if (!t) continue; out += t;
        if (!shown){
          const h = out.trimStart();
          if (h.startsWith('[WAIT')){ decision='WAIT'; rd.cancel(); break outer; }
          if (h.startsWith('[SKIP')){ decision='SKIP'; rd.cancel(); break outer; }
          if (h.length >= 6 || (h.length && h[0] !== '[')){ shown = true; $('ans').textContent = ''; }
        }
        if (shown) $('ans').textContent = out;
      }
    }
    setStatus('● 聆听中');
    if (decision==='WAIT') return;                 // 没说完：保留已转录内容，继续等
    if (decision==='SKIP'){ pending=''; return; }  // 不需要回答
    if (out.trim()){ pending=''; history.push({role:'user',content:'面试官说：'+q},{role:'assistant',content:out}); }
  }catch(e){
    if (e.name!=='AbortError'){ $('ans').textContent = '请求失败：'+e.message+'\n（如果是跨域/CORS 问题，请换用支持浏览器直连的 API 或自建代理）'; setStatus('● 聆听中'); }
  }
}

/* ---------- Controls ---------- */
async function start(){
  running = true;
  if (cfg.engine==='web' && navigator.standalone) $('interim').textContent='提示：主屏幕 App 模式下 iOS 的自带识别常不可用，若立即停止，请改在 Safari 打开或切换 Whisper 模式。';
  const ok = cfg.engine==='web' ? startWeb() : await startWhisper();
  if (!ok){ running=false; return; }
  $('btnRec').textContent='停止'; $('btnRec').classList.add('on'); setStatus('● 聆听中');
  try{ wake = await navigator.wakeLock?.request('screen'); }catch(e){}
}
function stop(){
  running = false; clearTimeout(t1); clearTimeout(t2); if(ctrl) ctrl.abort(); clearTimeout(segTimer);
  try{ sr && sr.stop(); }catch(e){}
  stream && stream.getTracks().forEach(t=>t.stop());
  try{ wake && wake.release(); }catch(e){}
  $('btnRec').textContent='开始'; $('btnRec').classList.remove('on'); setStatus('已停止'); $('interim').textContent='';
}
$('btnRec').onclick = () => running ? stop() : start();
$('btnClr').onclick = () => { clearTimeout(t1); clearTimeout(t2); if(ctrl) ctrl.abort(); finalText=''; pending=''; history.length=0; $('tr').textContent=''; $('interim').textContent=''; $('ans').textContent=''; };
document.addEventListener('visibilitychange', async()=>{ if(running && !document.hidden){ try{ wake = await navigator.wakeLock?.request('screen'); }catch(e){} } });
</script>
</body>
</html>
